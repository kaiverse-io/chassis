name: ci

# chassis dogfoods its own gates. `just ci` lints the template + checks the cockpit-section
# sync; `just accept` stamps a throwaway project and runs *its* `just ci` end to end. The
# separate devcontainer-build job exists because `just accept` never invokes Docker, so it
# cannot catch image-level breakage (the v0.7.5 lesson — see CHANGELOG).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: just ci + just accept
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install just and copier
        run: |
          # Pin just to a GitHub release binary rather than piping the unpinned
          # just.systems/install.sh through bash — that host intermittently 403s a
          # runner and would flake a release run (chassis's own ADR-004 preference:
          # a pinned release asset over a piped install script). --retry rides out
          # transient GitHub blips too.
          # renovate: datasource=github-releases depName=casey/just extractVersion=^(?<version>.*)$
          JUST_VERSION="1.56.0"
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          uv tool install copier
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64) ga=x64 ;;
            aarch64|arm64) ga=arm64 ;;
            *) echo "unsupported arch: $arch"; exit 1 ;;
          esac
          curl -sSL --retry 5 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ga}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install opengrep
        env:
          OPENGREP_VERSION: "1.26.0"
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64) asset=opengrep_manylinux_x86 ;;
            aarch64|arm64) asset=opengrep_manylinux_aarch64 ;;
            *) echo "unsupported arch: $arch"; exit 1 ;;
          esac
          curl -sSL --retry 5 --retry-all-errors \
            "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/${asset}" \
            -o /tmp/opengrep
          sudo install -m 0755 /tmp/opengrep /usr/local/bin/opengrep
          opengrep --version


      - name: just ci
        run: just ci

      - name: just accept
        run: just accept

  devcontainer-build:
    name: devcontainer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build chassis's own devcontainer image
        run: |
          npm install -g @devcontainers/cli
          devcontainer build --workspace-folder .
