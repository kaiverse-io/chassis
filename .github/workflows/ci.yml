name: ci

# chassis dogfoods its own gates. `just ci` lints the template + checks the cockpit-section
# sync; `just accept` stamps a throwaway project and runs *its* `just ci` end to end. The
# separate devcontainer-build job exists because `just accept` never invokes Docker, so it
# cannot catch image-level breakage (the v0.7.5 lesson — see CHANGELOG).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: just ci + just accept
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install just and copier
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to "$HOME/.local/bin"
          uv tool install copier
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: just ci
        run: just ci

      - name: just accept
        run: just accept

  devcontainer-build:
    name: devcontainer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build chassis's own devcontainer image
        run: |
          npm install -g @devcontainers/cli
          devcontainer build --workspace-folder .
