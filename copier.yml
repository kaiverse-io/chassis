_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml
# Default (false) dereferences symlinks into duplicated real files/directories on every
# stamp and every `copier update` — the only symlink in template/ today
# (.claude/skills -> ../.agents/skills) was silently losing its "one canonical copy,
# thin adapter" property because of this. Its name doesn't end in .jinja, so it isn't
# affected by preserve_symlinks' target-gets-Jinja-rendered special case.
_preserve_symlinks: true
_tasks:
  - git init -b main
  - uv sync
  - "pre-commit install || echo 'pre-commit not found — run: pre-commit install'"

# ── Questions ─────────────────────────────────────────────────────────────────

project_name:
  type: str
  help: "Human-readable project name (e.g. 'Acme Service')"

python_package_name:
  type: str
  help: "Python package name — snake_case (e.g. 'acme_service')"
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"

description:
  type: str
  help: "One-line project description"

python_version:
  type: str
  help: "Minimum Python version"
  default: "3.12"

coverage_fail_under:
  type: int
  help: "Initial pytest-cov floor (0–100). Bucket B ratchet — stamp sets the starting value into both fail_under and --cov-fail-under; raise both as coverage grows, never lower. On copier update, answer with the project's current floor so a default of 0 cannot rewrite it. CI enforces via just ci-test."
  default: 0
  validator: "{% if coverage_fail_under < 0 or coverage_fail_under > 100 %}Must be an integer from 0 to 100{% endif %}"

include_ts:
  type: bool
  help: "Add TypeScript-oriented dev tooling (pre-commit cache volume, VS Code extension)? Does not scaffold any TypeScript files or a package.json — bring your own TS module and this just wires the tooling around it."
  default: false

install_ai_coach:
  type: bool
  help: "Install AI Engineer Coach? Opt-in — it publishes no release, so enabling it builds a VS Code extension from upstream source (git clone + npm ci, pinned to a commit), and its Claude Code session-log support is unconfirmed."
  default: false

enable_docker_outside_of_docker:
  type: bool
  help: "Enable docker-outside-of-docker (forwards the host's docker.sock, for projects whose docker-compose.yml boots services beyond `app`)? Only works when the host itself runs Docker — leave off for a no-host-Docker remote/cloud devcontainer. Grants the container read-write access to the host's docker socket (post-create.sh chmod 666's it) — equivalent to root on the host, so this is opt-in, not a default."
  default: false

author_name:
  type: str
  help: "Author name"

author_email:
  type: str
  help: "Author email (leave blank to omit — GitHub commit authorship already carries attribution; only set this if the package needs a contact address, e.g. oss@example.com)"
  default: ""

github_owner:
  type: str
  help: "GitHub owner / org (e.g. 'kaiverse-io')"

license:
  type: str
  help: "License"
  choices:
    - Proprietary
    - MIT
    - Apache-2.0
  default: Apache-2.0
