_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_tasks:
  - git init
  - uv sync
  - "pre-commit install || echo 'pre-commit not found — run: pre-commit install'"

# ── Questions ─────────────────────────────────────────────────────────────────

project_name:
  type: str
  help: "Human-readable project name (e.g. 'ExampleProject')"

python_package_name:
  type: str
  help: "Python package name — snake_case (e.g. 'example_project')"
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"

description:
  type: str
  help: "One-line project description"

python_version:
  type: str
  help: "Minimum Python version"
  default: "3.12"

include_ts:
  type: bool
  help: "Include TypeScript module? (opt-in)"
  default: false

author_name:
  type: str
  help: "Author name"

author_email:
  type: str
  help: "Author email"

github_owner:
  type: str
  help: "GitHub owner / org (e.g. 'km2411')"

license:
  type: str
  help: "License"
  choices:
    - Proprietary
    - MIT
    - Apache-2.0
  default: Proprietary
