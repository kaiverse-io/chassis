_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_tasks:
  - git init
  - uv sync
  - "pre-commit install || echo 'pre-commit not found — run: pre-commit install'"

# ── Questions ─────────────────────────────────────────────────────────────────

project_name:
  type: str
  help: "Human-readable project name (e.g. 'Acme Service')"

python_package_name:
  type: str
  help: "Python package name — snake_case (e.g. 'acme_service')"
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"

description:
  type: str
  help: "One-line project description"

python_version:
  type: str
  help: "Minimum Python version"
  default: "3.12"

coverage_fail_under:
  type: int
  help: "Initial pytest-cov floor (0–100). Bucket B ratchet — stamp sets the starting value; raise it in the project as coverage grows, never lower it. CI enforces via just ci-test."
  default: 0
  validator: "{% if coverage_fail_under < 0 or coverage_fail_under > 100 %}Must be an integer from 0 to 100{% endif %}"

include_ts:
  type: bool
  help: "Include TypeScript module? (opt-in)"
  default: false

install_ai_coach:
  type: bool
  help: "Install AI Engineer Coach? Opt-in — it publishes no release, so enabling it builds a VS Code extension from upstream source (git clone + npm ci, pinned to a commit), and its Claude Code session-log support is unconfirmed."
  default: false

enable_docker_outside_of_docker:
  type: bool
  help: "Enable docker-outside-of-docker (forwards the host's docker.sock, for projects whose docker-compose.yml boots services beyond `app`)? Only works when the host itself runs Docker — turn off for a no-host-Docker remote/cloud devcontainer."
  default: true

author_name:
  type: str
  help: "Author name"

author_email:
  type: str
  help: "Author email (leave blank to omit — GitHub commit authorship already carries attribution; only set this if the package needs a contact address, e.g. oss@example.com)"
  default: ""

github_owner:
  type: str
  help: "GitHub owner / org (e.g. 'km2411')"

license:
  type: str
  help: "License"
  choices:
    - Proprietary
    - MIT
    - Apache-2.0
  default: Proprietary
