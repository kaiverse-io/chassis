# Standalone dev environment for chassis itself — not a stamped project's devcontainer
# (that's template/.devcontainer/*.jinja). This lets someone clone kaiverse-io/chassis on its
# own and get a working "Reopen in Container" experience without needing a sibling
# project to piggyback inside, which is how chassis was actually developed before this
# file existed.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/chassis:cached
      - uv-cache:/home/vscode/.cache/uv
      - precommit-cache:/home/vscode/.cache/pre-commit
      # Claude Code session transcripts deliberately have NO separate mount here —
      # see docs/explanation/devcontainer-persistence.md for why a nested named
      # volume here turned out to be less durable than the plain ~/.claude bind
      # mount on a local devcontainer, not more.
    environment:
      UV_LINK_MODE: copy

volumes:
  uv-cache:
  precommit-cache:
